<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets (home indicator) reach the tab bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Add to Home Screen: open full-screen, no Safari toolbar. Sign-in works there
         with a password (Settings), since email links always open in Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": with translucent, iOS starts the page under the
         status bar but sizes it as if it didn't, leaving an unpaintable strip at the bottom. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="HomeThread" />
    <!-- Scope = the whole site, so in-app navigation never opens a Safari sheet. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Her logo as the Home Screen and browser-tab icon (files in public/). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>HomeThread</title>
    <!-- Same layout fixes as Market Desk's Home Screen app (C:\Dev\MarketDesk\apps\web\public\index.html). -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        /* Her cream (theme.ts bg), so Safari's toolbar tint blends with the app. */
        background: #f7f3e8;
      }
      /* Lock the document so iOS can't rubber-band or shift the whole page;
         only the app's own scroll views scroll. */
      html {
        overscroll-behavior: none;
      }
      body {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Pin the app to the visible screen: tracks Safari's toolbar and fills the
         Home Screen app edge to edge. Safe-area padding is applied inside the app. */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
      }
    </style>
  <meta name="theme-color" content="#52709a">
</head>
